<div class="result-title" id="result-title">Ваш результат</div>
<div class="result-percent" id="result-percent">0%</div>
<div class="result-text" id="result-text"></div>
<button class="btn" onclick="location.reload()">Пройти ще раз</button>
</div>
</div>
</div>

</div>

<script>
let currentSlide = 0;
let totalScore = 0;
const maxScore = 50; // 10 questions * max 5 points

function selectOption(btn, score) {
  const parent = btn.parentElement;
  const options = parent.querySelectorAll('.option');
  options.forEach(o => o.classList.remove('selected'));
  btn.classList.add('selected');
  totalScore += score;
  const btnId = parent.querySelector('.btn').id;
  document.getElementById(btnId).classList.remove('hidden');
}

function nextSlide() {
  document.getElementById('slide-' + currentSlide).classList.remove('active');
  currentSlide++;
  const next = document.getElementById('slide-' + currentSlide);
  if (next) next.classList.add('active');
}

function showResult() {
  const percentage = Math.round((totalScore / maxScore) * 100);
  const percentEl = document.getElementById('result-percent');
  const textEl = document.getElementById('result-text');
  const titleEl = document.getElementById('result-title');

  percentEl.textContent = percentage + '%';

  if (percentage >= 70) {
    percentEl.className = 'result-percent result-passed';
    titleEl.textContent = 'Ви підходите на цю позицію';
    textEl.textContent = 'Вітаємо! Ваші відповіді показують, що ви розумієте специфіку роботи з VIP-клієнтами: ви розмовляєте мовою бізнесу, орієнтовані на довгострокові стосунки та вмієте знаходити баланс між потребами клієнта і якістю рішення. Ви готові до наступного етапу — розмови з HR та керівництвом компанії.';
  } else if (percentage >= 50) {
    percentEl.className = 'result-percent result-failed';
    titleEl.textContent = 'Потрібне доопрацювання';
    textEl.textContent = 'Дякуємо за участь. Ваші відповіді показують потенціал, але є кілька зон, які варто підтягнути: глибше розуміння контексту бізнесу клієнта, адаптація комунікації під рівень співрозмовника та розвиток партнерського підходу замість трансакційного. Рекомендуємо звернути увагу на ці аспекти перед наступним кроком.';
  } else {
    percentEl.className = 'result-percent result-failed';
    titleEl.textContent = 'Необхідний розвиток';
    textEl.textContent = 'Дякуємо за проходження тесту. Результат показує, що поточний підхід до комунікації та роботи з клієнтами потребує значного доопрацювання для цієї ролі. Зосередьтесь на розумінні потреб клієнта, роботі з бізнес-мовою та розвитку навичок партнерського супроводу.';
  }

  document.getElementById('slide-10').classList.remove('active');
  document.getElementById('slide-result').classList.add('active');
}
</script>

</body>
</html>
